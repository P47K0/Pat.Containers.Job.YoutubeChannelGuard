name: Youtube Channel Guard Docker Deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_TAG: gha-${{ github.run_id }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      ACA_ENV_NAME: ${{ vars.ACA_ENVIRONMENT_NAME }}
      CONTAINER_APP_JOB_NAME: youtube-channel-guard
      IMAGE_NAME: youtube-channel-guard
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_CHANNEL_HANDLE: ${{ vars.YOUTUBE_CHANNEL_HANDLE }}
      ALLOWED_VIDEO_COUNT: ${{ vars.ALLOWED_VIDEO_COUNT }}
      ACS_CONNECTION_STRING: ${{ secrets.ACR_CONNECTION_STRING }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      MAIL_TO: ${{ vars.MAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug folder structure
        run: |
          ls -la
          echo "-------------------"
          ls -la Pat.Containers.Job.YoutubeChannelGuard || echo "Pat.Containers.Job.YoutubeChannelGuard folder not found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Pat.Containers.Job.YoutubeChannelGuard/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ACA Scheduled Job
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG"

          echo "Deploying ACA Scheduled Job image: $IMAGE"

          if az containerapp job show --name "$CONTAINER_APP_JOB_NAME" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "ACA Job exists → Updating..."
            az containerapp job update \
              --name "$CONTAINER_APP_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --cpu 0.25 \
              --memory 0.5Gi \
              --trigger-type Schedule \
              --cron-expression "*/5 * * * *" \
              --replica-timeout 1800 \
              --replica-retry-limit 0 \
              --parallelism 1 \
              --replica-completion-count 1 \
              --env-vars \
                AppSettings__YouTubeApiKey="$YOUTUBE_API_KEY" \
                AppSettings__YouTubeChannelId="$YOUTUBE_CHANNEL_ID" \
                AppSettings__YouTubeChannelHandle="$YOUTUBE_CHANNEL_HANDLE" \
                AppSettings__AllowedVideoCount="$ALLOWED_VIDEO_COUNT" \
                AppSettings__AcsConnectionString="$ACS_CONNECTION_STRING" \
                AppSettings__MailFrom="$MAIL_FROM" \
                AppSettings__MailTo="$MAIL_TO"
          else
            echo "ACA Job does not exist → Creating..."
            az containerapp job create \
              --name "$CONTAINER_APP_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV_NAME" \
              --image "$IMAGE" \
              --cpu 0.25 \
              --memory 0.5Gi \
              --trigger-type Schedule \
              --cron-expression "*/5 * * * *" \
              --replica-timeout 1800 \
              --replica-retry-limit 0 \
              --parallelism 1 \
              --replica-completion-count 1 \
              --env-vars \
                AppSettings__YouTubeApiKey="$YOUTUBE_API_KEY" \
                AppSettings__YouTubeChannelId="$YOUTUBE_CHANNEL_ID" \
                AppSettings__YouTubeChannelHandle="$YOUTUBE_CHANNEL_HANDLE" \
                AppSettings__AllowedVideoCount="$ALLOWED_VIDEO_COUNT" \
                AppSettings__AcsConnectionString="$ACS_CONNECTION_STRING" \
                AppSettings__MailFrom="$MAIL_FROM" \
                AppSettings__MailTo="$MAIL_TO"
          fi
